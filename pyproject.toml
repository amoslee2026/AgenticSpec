[project]
name = "agenticspec"
version = "0.1.0"
description = "结构化文档知识库：结构化库为唯一权威源，Agent 可读/可写/可追溯"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "AgenticSpec contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "pyyaml>=6.0",
    "typer>=0.15",
    "httpx>=0.28",
    "python-multipart>=0.0.12",
    "agentic-logger>=0.1.4",
    "jsonschema>=4.26.0",
    "mcp>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[project.scripts]
agenticspec = "agenticspec.cli:app"
agenticspec-api = "agenticspec.app:main"

[project.urls]
Homepage = "https://github.com/amoslee2026/AgenticSpec"
Repository = "https://github.com/amoslee2026/AgenticSpec"
Issues = "https://github.com/amoslee2026/AgenticSpec/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticspec"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "perf: 性能基准（慢，默认跳过）",
    "integration: 需要 PG 的集成测试",
]

# 集成测试的库状态约束（见 tests/integration/conftest.py 模块文档）
# 全量验收命令（保持默认，不 drop schema）：
#   unset all_proxy ALL_PROXY && uv run pytest tests/unit tests/integration -q
# 需要确定性干净起点时（不可与他人并行）才设 AGENTICSPEC_TEST_DROP_SCHEMA=1

[tool.uv]
default-groups = ["dev"]
